# Browser installato da usare: msedge oppure chrome. Vuoto = Chromium scaricato da Playwright
browser.channel=msedge

# Pausa in secondi tra una posizione e l'altra
pausa.secondi=2

# ---------------------------------------------------------------------------
# INPS - Cassetto Previdenziale Contribuente
# ---------------------------------------------------------------------------
inps.url.login=https://www.inps.it/

# Numero massimo di soggetti da elaborare in questa esecuzione. 0 = tutti.
# Per la prima prova lasciare 3, poi mettere 0.
inps.limite=3

# Gestioni da scaricare, separate da virgola (come appaiono nella colonna Gestione). Vuoto = tutte
inps.gestioni=Aziende DM

# Le posizioni il cui Stato contiene una di queste parole vengono saltate (separate da virgola)
inps.stati.esclusi=Cessata

# Secondi di attesa dei dati sintetici prima di chiudere la finestra e riprovare (3 tentativi)
inps.attesa.secondi=20

# Selettori CSS da usare solo se quelli automatici non funzionano
inps.sel.apriRicerca=
inps.sel.chiudiFinestra=

# ---------------------------------------------------------------------------
# AGENZIA DELLE ENTRATE - da fare dopo l'INPS
# ---------------------------------------------------------------------------
soglia.similarita=0.92
ade.url.login=https://ivaservizi.agenziaentrate.gov.it/portale/
ade.url.selezione=
ade.sel.inputCf=
ade.sel.conferma=
ade.url.anagrafica=
ade.sel.linkAnagrafica=
ade.sel.denominazione=
ade.sel.atecoPrevalente=
ade.sel.atecoSecondari=
