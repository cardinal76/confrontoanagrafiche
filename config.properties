# Browser installato da usare: msedge oppure chrome. Vuoto = Chromium scaricato da Playwright
browser.channel=msedge

# Pausa in secondi tra una posizione e l'altra
pausa.secondi=2

# ---------------------------------------------------------------------------
# INPS - Cassetto Previdenziale Contribuente
# ---------------------------------------------------------------------------
inps.url.login=https://www.inps.it/

# Interfaccia del cassetto: nuovo = "La tua scrivania" con Ricerca Posizione; vecchio = menu scuro a sinistra
inps.flusso=vecchio

# Numero massimo di soggetti da elaborare in questa esecuzione. 0 = tutti.
# Per la prima prova lasciare 3, poi mettere 0.
inps.limite=3

# Gestioni da scaricare, separate da virgola (come appaiono nella colonna Gestione). Vuoto = tutte
inps.gestioni=Aziende DM

# Le posizioni il cui Stato contiene una di queste parole vengono saltate (separate da virgola)
inps.stati.esclusi=Cessata

# Secondi di attesa dei dati sintetici prima di chiudere la finestra e riprovare
inps.attesa.secondi=20
inps.tentativi=4

# Secondi di attesa tra la scelta della posizione e l'apertura dei Dati Sintetici.
# Se compare spesso "Ticket non valido", aumentare.
inps.pausa.selezione.secondi=2

# Selettori CSS da usare solo se quelli automatici non funzionano
inps.sel.apriRicerca=
inps.sel.chiudiFinestra=
inps.sel.paginaSuccessiva=

# ---------------------------------------------------------------------------
# AGENZIA DELLE ENTRATE - cassetto fiscale (comando: ade)
# ---------------------------------------------------------------------------
ade.url.login=https://www.agenziaentrate.gov.it/

# Excel da cui leggere i codici fiscali (colonna "CF soggetto" o "Codice fiscale", altrimenti la A).
# Puo' essere un percorso completo, ad esempio /mnt/p/alessandra/inps.xlsx
ade.input.file=inps.xlsx

# Numero massimo di codici fiscali per esecuzione. 0 = tutti. Per la prima prova lasciare 3.
ade.limite=3

# Secondi di attesa dopo ogni passo del percorso registrato
ade.pausa.passo.secondi=1.5

# ---------------------------------------------------------------------------
# CONFRONTO
# ---------------------------------------------------------------------------
soglia.similarita=0.92
